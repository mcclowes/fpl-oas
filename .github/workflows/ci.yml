name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Lint and build the spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fpl-oas
        uses: actions/checkout@v4
        with:
          path: fpl-oas

      - name: Checkout omg repo
        uses: actions/checkout@v4
        with:
          repository: mcclowes/omg
          path: omg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build omg packages
        working-directory: omg
        run: |
          npm ci
          npm run build

      - name: Install fpl-oas dependencies
        working-directory: fpl-oas
        run: npm install --ignore-scripts || true

      - name: Lint OMG files
        working-directory: fpl-oas
        run: node ../omg/packages/omg-md-cli/dist/cli.js lint endpoints/

      - name: Build OpenAPI spec
        working-directory: fpl-oas
        run: node ../omg/packages/omg-md-cli/dist/cli.js build api.omg.md -o static/openapi.yaml

      # Reports drift rather than failing: the published omg-md-cli lags this
      # repo's sources, so contributors cannot always regenerate locally.
      - name: Report drift in the committed spec
        working-directory: fpl-oas
        run: |
          if [ ! -f static/openapi.yaml ]; then
            echo "Error: openapi.yaml was not generated"
            exit 1
          fi
          if git diff --quiet -- static/openapi.yaml; then
            echo "Committed spec matches the OMG sources."
          else
            echo "::warning::static/openapi.yaml differs from the OMG sources. Run 'npm run build:spec' and commit the result."
            git diff --stat -- static/openapi.yaml
          fi

  site:
    name: Build the site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  sdk:
    name: Generate and build the TypeScript client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci
        working-directory: sdk
      - run: npm run check
        working-directory: sdk
